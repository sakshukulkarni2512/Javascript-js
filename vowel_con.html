<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Check alphabet is vowel or consonant</h1>

    <script>

        var ch=prompt("Enter the alphabet")

        if(ch=='A'||ch=='E'||ch=='I'||ch=='O'||ch=='U'||ch=='a'||ch=='e'||ch=='i'||ch=='o'||ch=='u')
    {
        document.write("Given alphabet is vowel");

    }
    else
    {
        document.write("Given alphabet is consonant");
    }
    </script>
</body>
</html>
