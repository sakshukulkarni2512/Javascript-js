<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Print day name using (1-7)</h1>

    <script>

        var ch=Number(prompt("------Enter your choice for Print days of Months-----"))

        switch(ch)
        {
            case 1:
                document.write("January")
                break;
            
            case 2:
                document.write("Februvary")
                break;

            case 3:
                document.write("March")
                break;

            case 4:
                document.write("April")
                break;
            
            case 5:
                document.write("May")
                break;
            
            case 6:
                document.write("June")
                break;

            case 7:
                document.write("july")
                break;

            case 8:
                document.write("August")
                break;
            
            case 9:
                document.write("September")
                break;

            case 10:
                document.write("octomber")
                break;
            
            case 11:
                document.write("November")
                break;

            case 12:
                document.write("December")
                break;


            default:
                document.write("Invalid Choice! please enter valid choice");

        }

    </script>
</body>
</html>
