<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Print day name using (1-7)</h1>

    <script>

        var ch=Number(prompt("------Enter your choice for Print days of Week-----"))

        switch(ch)
        {
            case 1:
                document.write("Sunday")
                break;
            
            case 2:
                document.write("Monday")
                break;

            case 3:
                document.write("Tuesday")
                break;

            case 4:
                document.write("Wednesday")
                break;
            
            case 5:
                document.write("Thursday")
                break;
            
            case 6:
                document.write("Friday")
                break;

            case 7:
                document.write("Saturday")
                break;

            default:
                document.write("Invalid Choice! please enter valid choice");

        }

    </script>
</body>
</html>
