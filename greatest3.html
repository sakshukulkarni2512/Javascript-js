<html lang="en">

</head>
<body>
    <h1>Greatest Number between 3 numbers</h1>
    <script>

        var  n1=Number(prompt("Enter first number"));
        var n2=Number(prompt("Enter second number"));
        var n3=Number(prompt("Enter third number"));

        if(n1>n2&&n1>n3)
    {
        document.write("n1 is greater");

    }
    else if(n2>n1&&n2>n3)
    {
        document.write("n2 is greater")
    }
    else
    {
        document.write("n3 is greater")
    }
    </script>
</body>
