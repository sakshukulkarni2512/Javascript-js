<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chheck number is even or odd</h1>
    <script>
        var num=Number(prompt("Enter the number to check given number is even or odd"));

        if(num%2==0)
    {
        document.write("Given number is even");
    }
    else
    {
        document.write("Given number is odd");
    }
    </script>
</body>
</html>
