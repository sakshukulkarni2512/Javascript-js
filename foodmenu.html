<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Food Menu Item</h1>

    <script>
        var ch=Number(prompt("-----Enter your Choice for Food Menu-----"))

        switch(ch)
        {
            case 1:
                document.write("Pizza");
                break;

            case 2:
                document.write("Burger");
                break;

            case 3:
                document.write("Finger fries");
                break;

            case 4:
                document.write("Cake");
                break;

            
            default:
                document.write("Invalid choice");
                break;
        }
    </script>
</body>
</html>
