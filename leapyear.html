<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Check year is leap year or not</h1>
    <script>

        var year=Number(prompt("Enter the year"));

        if(year%4==0||year%400==0)
    {
        document.write("Enter year is leap year");

    }
    else
    {
        document.write("Enter year is not leap year");
    }
    </script>
</body>
</html>
